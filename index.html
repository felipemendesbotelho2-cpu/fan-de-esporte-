<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fan de Esporte — Jogos do Dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080B10;
    --panel:#10151D;
    --panel-2:#161C26;
    --border:#232B37;
    --border-soft:#1B222C;
    --text:#EAF1F5;
    --muted:#8792A6;
    --muted-2:#59637A;
    --accent:#00E28A;
    --teal:#00C2A8;
    --green:#00E28A;
    --yellow:#E2B93D;
    --red:#FF4D5E;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --display:'Space Grotesk', sans-serif;
    --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(0,226,138,0.07), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(0,194,168,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    line-height:1.5;
  }
  ::selection{ background:rgba(0,226,138,0.35); }
  a{color:var(--accent);}

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header.top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    border-bottom:1px solid var(--border-soft);
    padding-bottom:20px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand .mark{
    width:48px;height:48px;
    border:1px solid var(--border);
    border-radius:13px;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(120% 130% at 25% 15%, rgba(0,226,138,0.22), transparent 60%),
      radial-gradient(120% 130% at 80% 90%, rgba(0,194,168,0.18), transparent 60%),
      var(--panel);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    font-size:22px;
    line-height:1;
    flex-shrink:0;
  }
  .brand .welcome{
    display:block;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:1.8px;
    text-transform:uppercase;
    color:var(--muted-2);
    margin-bottom:3px;
  }
  .brand h1{
    font-family:var(--display);
    font-size:23px;
    font-weight:700;
    margin:0;
    letter-spacing:0.2px;
    background:linear-gradient(90deg, var(--accent), var(--teal));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .clock{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted-2);
    text-align:right;
    padding-top:4px;
  }

  .sponsor-box{
    margin-top:10px;
    padding:10px 12px;
    border:1px dashed var(--border);
    border-radius:10px;
    background:var(--panel);
    display:flex;
    align-items:center;
    gap:10px;
    max-width:260px;
    margin-left:auto;
  }
  .sponsor-box .sponsor-text{
    font-family:var(--mono);
    font-size:11px;
    line-height:1.4;
    color:var(--muted);
    white-space:nowrap;
  }
  .sponsor-box .sponsor-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 12px;
    font-size:11.5px;
    white-space:nowrap;
    text-decoration:none;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px;
  }
  .panel + .panel{ margin-top:18px; }

  button{
    font-family:var(--body);
    font-weight:600;
    font-size:13.5px;
    border-radius:7px;
    border:1px solid transparent;
    padding:11px 18px;
    cursor:pointer;
  }
  .btn-primary{ background:var(--accent); color:#04170D; }
  .btn-ghost{ background:transparent; border-color:var(--border); color:var(--muted); }

  /* ---------- Médias & Estatísticas ---------- */
  .avg-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }
  @media (max-width:760px){ .avg-grid{ grid-template-columns:1fr; } }
  .avg-col{
    border:1px solid var(--border);
    border-radius:9px;
    padding:14px 16px;
    background:var(--panel-2);
  }
  .avg-col.home{ border-top:2px solid var(--accent); }
  .avg-col.away{ border-top:2px solid var(--teal); }
  .avg-col-title{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:12px;
  }
  .avg-col.home .avg-col-title{ color:var(--accent); }
  .avg-col.away .avg-col-title{ color:var(--teal); }
  .venue-toggle{ display:flex; gap:4px; }
  .venue-btn{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.4px;
    text-transform:uppercase;
    padding:5px 11px;
    border-radius:6px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--muted);
    cursor:pointer;
  }
  .avg-col.home .venue-btn.active{
    color:var(--accent);
    border-color:var(--accent);
    background:rgba(0,226,138,0.1);
  }
  .avg-col.away .venue-btn.active{
    color:var(--teal);
    border-color:var(--teal);
    background:rgba(0,194,168,0.1);
  }
  .avg-item{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:3px;
    padding:9px 0;
    border-bottom:1px solid var(--border-soft);
    font-size:12.5px;
  }
  .avg-item:last-child{ border-bottom:none; }
  .avg-item span.lbl{ color:var(--muted); font-size:11px; text-transform:uppercase; }
  .avg-item span.val{ font-family:var(--mono); font-weight:600; color:var(--text); }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="mark">⚽</div>
      <div>
        <span class="welcome">bem-vindo(a) ao</span>
        <h1>Fan de Esporte</h1>
      </div>
    </div>
  </header>

  <!-- ===== PAINEL DE MÉDIAS AJUSTADO ===== -->
  <section class="panel">
    <div class="avg-grid" id="avgGrid">
      
      <!-- Time da Casa -->
      <div class="avg-col home">
        <div class="avg-col-title">
          <span id="homeAvgLabel">Geral</span>
          <div class="venue-toggle">
            <button type="button" class="venue-btn active" data-prefix="home" data-venue="geral">Geral</button>
            <button type="button" class="venue-btn" data-prefix="home" data-venue="home">Casa</button>
            <button type="button" class="venue-btn" data-prefix="home" data-venue="away">Fora</button>
          </div>
        </div>
        <div class="avg-item"><span class="lbl">Gols por jogo</span><span class="val" id="homeAvgTotal">—</span></div>
        <div class="avg-item"><span class="lbl">Gols no 1º tempo</span><span class="val" id="homeAvgHT">—</span></div>
        <div class="avg-item"><span class="lbl">Gols no 2º tempo</span><span class="val" id="homeAvgST">—</span></div>
        <div class="avg-item"><span class="lbl">Escanteios</span><span class="val" id="homeStatCorners">—</span></div>
        <div class="avg-item"><span class="lbl">Finalizações</span><span class="val" id="homeStatShots">—</span></div>
        <div class="avg-item"><span class="lbl">Chutes no gol</span><span class="val" id="homeStatShotsOnGoal">—</span></div>
        <div class="avg-item"><span class="lbl">Cartões</span><span class="val" id="homeStatCards">—</span></div>
      </div>

      <!-- Time Visitante -->
      <div class="avg-col away">
        <div class="avg-col-title">
          <span id="awayAvgLabel">Geral</span>
          <div class="venue-toggle">
            <button type="button" class="venue-btn active" data-prefix="away" data-venue="geral">Geral</button>
            <button type="button" class="venue-btn" data-prefix="away" data-venue="home">Casa</button>
            <button type="button" class="venue-btn" data-prefix="away" data-venue="away">Fora</button>
          </div>
        </div>
        <div class="avg-item"><span class="lbl">Gols por jogo</span><span class="val" id="awayAvgTotal">—</span></div>
        <div class="avg-item"><span class="lbl">Gols no 1º tempo</span><span class="val" id="awayAvgHT">—</span></div>
        <div class="avg-item"><span class="lbl">Gols no 2º tempo</span><span class="val" id="awayAvgST">—</span></div>
        <div class="avg-item"><span class="lbl">Escanteios</span><span class="val" id="awayStatCorners">—</span></div>
        <div class="avg-item"><span class="lbl">Finalizações</span><span class="val" id="awayStatShots">—</span></div>
        <div class="avg-item"><span class="lbl">Chutes no gol</span><span class="val" id="awayStatShotsOnGoal">—</span></div>
        <div class="avg-item"><span class="lbl">Cartões</span><span class="val" id="awayStatCards">—</span></div>
      </div>

    </div>
  </section>

</div>

<script>
// Gerenciador dos Filtros de Mando (GERAL / CASA / FORA)
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('venue-btn')) {
    const btn = e.target;
    const parent = btn.closest('.venue-toggle');
    if (!parent) return;

    // Alterna a classe ativa
    parent.querySelectorAll('.venue-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const prefix = btn.getAttribute('data-prefix');
    const venue = btn.getAttribute('data-venue');

    if (prefix) {
      // Atualiza o texto do cabeçalho
      const labelElem = document.getElementById(`${prefix}AvgLabel`);
      if (labelElem) {
        labelElem.textContent = venue === 'geral' ? 'Geral' : (venue === 'home' ? 'Casa' : 'Fora');
      }

      // Função que recalcula os dados (conecte com a sua função do backend/fetch)
      if (typeof updateTeamAverages === 'function') {
        updateTeamAverages(prefix, venue);
      }
    }
  }
});
</script>
</body>
</html>
