name: Atualizar jogos do dia

on:
  schedule:
    # Os horários de "cron" do GitHub Actions são sempre em UTC.
    # Isso roda às 08h, 11h, 14h, 17h, 20h e 23h no horário de Brasília
    # (UTC = horário de Brasília + 3h). Ajuste como preferir.
    - cron: '0 11,14,17,20,23,2 * * *'
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow" na aba Ações

permissions:
  contents: write   # necessário pra o robô poder salvar o dados.json de volta no repositório

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar dados.json
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/gerar-dados.mjs

      - name: Publicar dados.json atualizado
        run: |
          git config user.name "robo-fan-de-esporte"
          git config user.email "robo@users.noreply.github.com"
          git add dados.json
          git diff --cached --quiet || git commit -m "Atualiza dados.json"
          git push
